name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get
        working-directory: zearah-raid-main

      - name: Build APK
        run: flutter build apk --release
        working-directory: zearah-raid-main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ride-on-release-apk
          path: zearah-raid-main/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
